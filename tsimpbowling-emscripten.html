<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #111;
    color: #fff;
    font-family: Verdana, sans-serif;
    overflow: hidden;
  }

  #game-container {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: row;
    background: #000;
  }

  /* Left side: Game screen area */
  #screen-area {
    flex: 1;
    min-width: 0; /* Prevents flexbox from shrinking weirdly */
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    overflow: hidden;
  }

  /* Fills the maximum possible 4:3 space without clipping or focus borders */
  #canvas {
    width: 100% !important;
    height: 100% !important;
    object-fit: contain !important;
    aspect-ratio: 4 / 3;
    outline: none !important; /* Removes the blue focus ring */
    border: none !important;
    display: block;
    background: #000;
  }

  /* Right side: Your custom controls sidebar */
  #controls-sidebar {
    width: 280px; /* Slightly narrower to give the game screen more room */
    flex-shrink: 0;
    height: 100%;
    box-sizing: border-box;
    padding: 20px;
    background: #1a1a1a;
    border-left: 1px solid #333;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
  }

  #fs-btn {
    padding: 12px 16px;
    font-size: 15px;
    font-weight: bold;
    color: #fff;
    background: #2b6cb0;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }

  #fs-btn:hover {
    background: #3182ce;
  }

  /* Fullscreen overrides */
  #game-container:fullscreen #controls-sidebar {
    display: none;
  }

  #game-container:fullscreen #screen-area {
    width: 100vw;
    height: 100vh;
  }
</style>
