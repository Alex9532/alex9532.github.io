<!DOCTYPE html>
<html>
<head>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    /* !important prevents Emscripten SDL from overriding canvas size */
    #canvas {
      width: auto !important;
      height: 100% !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      aspect-ratio: 4 / 3;
      display: block;
      background: #000;
    }

    /* Overlay button in the bottom-right corner that fades out when idle */
    #fs-btn {
      position: absolute;
      bottom: 16px;
      right: 16px;
      z-index: 100;
      padding: 10px 16px;
      font-family: sans-serif;
      font-size: 14px;
      color: #fff;
      background: rgba(30, 30, 30, 0.8);
      border: 1px solid #666;
      border-radius: 4px;
      cursor: pointer;
    }

    #fs-btn:hover {
      background: rgba(70, 70, 70, 0.95);
    }

    /* Hide the button automatically once in fullscreen */
    #game-container:fullscreen #fs-btn {
      display: none;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <button id="fs-btn" onclick="enterFullscreen()">Fullscreen</button>
  </div>

  <script>
    var container = document.getElementById('game-container');
    var canvasElement = document.getElementById('canvas');

    var Module = {
      canvas: canvasElement,
      arguments: [
        'simpbowl',
        '-rompath', '/sb',
        '-mouse',
        '-autoframeskip',
        '-noautosave',
        '-window',
        '-video', 'soft'
      ],
      preRun: [function() {
        FS.mkdir('/sb');
        FS.mkdir('/sb/simpbowl');
        FS.createPreloadedFile('/sb', 'konamigv.zip', './tsimpbowling/konamigv.zip', true, false);
        FS.createPreloadedFile('/sb', 'simpbowl.zip', './tsimpbowling/simpbowl.zip', true, false);
        FS.createPreloadedFile('/sb/simpbowl', '829uaa02.chd', './tsimpbowling/829uaa02.chd', true, false);
      }]
    };

    function enterFullscreen() {
      if (container.requestFullscreen) {
        container.requestFullscreen();
      } else if (container.webkitRequestFullscreen) {
        container.webkitRequestFullscreen();
      }
      canvasElement.focus();
    }

    // Lock the mouse pointer only when clicking directly on the game screen
    canvasElement.addEventListener('click', function() {
      canvasElement.focus();
      if (document.fullscreenElement && canvasElement.requestPointerLock) {
        canvasElement.requestPointerLock();
      }
    });
  </script>
  <script async type="text/javascript" src="simpbowl.js"></script>
</body>
</html>
